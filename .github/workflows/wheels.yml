name: Build wheels

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/barflow/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (AMD64)
          - { os: windows-latest,   python: '313',  archs: AMD64,        label: win-cp313 }
          - { os: windows-latest,   python: '314',  archs: AMD64,        label: win-cp314 }
          - { os: windows-latest,   python: '313t', archs: AMD64,        label: win-cp313t, free_threaded: true }
          - { os: windows-latest,   python: '314t', archs: AMD64,        label: win-cp314t, free_threaded: true }
          # macOS (universal: x86_64 + arm64)
          - { os: macos-latest,     python: '313',  archs: 'x86_64 arm64', label: mac-cp313 }
          - { os: macos-latest,     python: '314',  archs: 'x86_64 arm64', label: mac-cp314 }
          - { os: macos-latest,     python: '313t', archs: 'x86_64 arm64', label: mac-cp313t, free_threaded: true }
          - { os: macos-latest,     python: '314t', archs: 'x86_64 arm64', label: mac-cp314t, free_threaded: true }
          # Linux x86_64 (native runner)
          - { os: ubuntu-latest,    python: '313',  archs: x86_64,       label: linux-cp313-x86_64 }
          - { os: ubuntu-latest,    python: '314',  archs: x86_64,       label: linux-cp314-x86_64 }
          - { os: ubuntu-latest,    python: '313t', archs: x86_64,       label: linux-cp313t-x86_64, free_threaded: true }
          - { os: ubuntu-latest,    python: '314t', archs: x86_64,       label: linux-cp314t-x86_64, free_threaded: true }
          # Linux aarch64 (native arm runner — no QEMU)
          - { os: ubuntu-24.04-arm, python: '313',  archs: aarch64,      label: linux-cp313-aarch64 }
          - { os: ubuntu-24.04-arm, python: '314',  archs: aarch64,      label: linux-cp314-aarch64 }
          - { os: ubuntu-24.04-arm, python: '313t', archs: aarch64,      label: linux-cp313t-aarch64, free_threaded: true }
          - { os: ubuntu-24.04-arm, python: '314t', archs: aarch64,      label: linux-cp314t-aarch64, free_threaded: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel==3.4.1

      - name: Build wheels
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENABLE: ${{ matrix.free_threaded && 'cpython-freethreading' || '' }}
          CIBW_TEST_COMMAND: >
            python -c "import barflow; list(barflow.track(range(1000)))"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI only when a tag is pushed. Uses Trusted Publishers
  # (OIDC) — no API token needed, but you must configure the publisher
  # on PyPI once. See docs/PUBLISHING.md.
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/barflow
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          skip-existing: true

  # Create or update the GitHub release for the pushed tag. Pulls the
  # matching section out of CHANGELOG.md for the release body and
  # attaches every built wheel + sdist as release assets.
  release:
    name: Create GitHub release
    needs: [build_wheels, build_sdist, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section for this tag
        run: python .github/scripts/extract_changelog.py "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag exists — updating notes and assets."
            gh release edit "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "barflow $tag" \
              --notes-file release_notes.md
            gh release upload "$tag" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "barflow $tag" \
              --notes-file release_notes.md \
              dist/*
          fi
