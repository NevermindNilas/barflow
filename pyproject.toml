[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barflow"
version = "0.4.0"
description = "Fast Python progress bars with a C++ core. Windows-first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NevermindNilas" },
]
keywords = [
    "progress", "progressbar", "progress-bar", "tqdm", "rich", "cli",
    "terminal", "spinner", "cpp", "c-extension", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage      = "https://github.com/NevermindNilas/barflow"
Repository    = "https://github.com/NevermindNilas/barflow"
Issues        = "https://github.com/NevermindNilas/barflow/issues"
Changelog     = "https://github.com/NevermindNilas/barflow/releases"
Documentation = "https://github.com/NevermindNilas/barflow/blob/main/docs/DESIGN.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build-verbosity = 1
test-command = 'python -c "import barflow; list(barflow.track(range(1000)))"'
skip = ["*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.macos]
# The C++17 core uses aligned new/delete, which Clang only emits for a
# deployment target of macOS 10.13+. CPython 3.12+ already defaults the
# x86_64 target high enough, but 3.10/3.11 default to 10.9 and fail to
# compile. cibuildwheel now enforces a 10.15 floor, so pin to that for
# every macOS build (arm64 is always 11.0+ regardless, so this only lifts
# the x86_64 leg). 10.15 still satisfies the aligned-new requirement.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
